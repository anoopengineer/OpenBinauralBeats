# Builds, smoke-tests and publishes the downloadable apps when a v* tag is pushed
# (cut tags with scripts/release.sh). Running it manually builds and tests everything
# but publishes nothing.
#
# Asset names are stable across releases; netlify.toml's /download/* redirects depend on them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: ./scripts/package-macos.sh --universal
      - run: mv dist/OpenBinauralBeats-*.dmg dist/OpenBinauralBeats-macos.dmg
      - name: Smoke-test the .dmg
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/OpenBinauralBeats-macos.dmg
          bin="$mnt/OpenBinauralBeats.app/Contents/MacOS/open-binaural-beats"
          archs=$(lipo -archs "$bin"); echo "architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep "$mnt/OpenBinauralBeats.app"
          scripts/smoke-test.sh "$bin"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/OpenBinauralBeats-macos.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - run: cargo build --release
      - run: Copy-Item target\release\open-binaural-beats.exe OpenBinauralBeats-windows-x64.exe
      - name: Smoke-test the .exe
        # Hosted Windows runners have no OpenGL 2 driver, so only check that the binary loads.
        run: |
          $expected = "OpenBinauralBeats " + (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $p = Start-Process -FilePath .\OpenBinauralBeats-windows-x64.exe -ArgumentList '--version' `
            -RedirectStandardOutput version.txt -NoNewWindow -Wait -PassThru
          $out = (Get-Content version.txt -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $out -ne $expected) {
            Write-Error "expected '$expected', got '$out' (exit $($p.ExitCode))"
            exit 1
          }
          Write-Output "ok: $out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: OpenBinauralBeats-windows-x64.exe
          if-no-files-found: error

  linux:
    needs: verify
    # Oldest supported runner, so the binary works on older glibc (Ubuntu 22.04, Debian 12).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev desktop-file-utils \
            xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          cargo install cargo-deb --version 3.8.0 --locked
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $HOME/.local/bin/appimagetool" | sha256sum -c
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: desktop-file-validate packaging/linux/open-binaural-beats.desktop
      - run: cargo test
      - run: cargo build --release
      - run: scripts/package-linux.sh
      - name: Smoke-test the packages
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/OpenBinauralBeats-linux-x86_64.tar.gz -C "$tmp"
          xvfb-run -a scripts/smoke-test.sh "$tmp/OpenBinauralBeats/open-binaural-beats"

          sudo apt-get install -y ./dist/OpenBinauralBeats-linux-amd64.deb
          xvfb-run -a scripts/smoke-test.sh /usr/bin/open-binaural-beats

          appimage="$PWD/dist/OpenBinauralBeats-linux-x86_64.AppImage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract-and-run --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/OpenBinauralBeats-linux-*
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum OpenBinauralBeats-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/OpenBinauralBeats-*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Create as a draft and publish only once every file is attached, so
          # releases/latest never points at an incomplete release.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "OpenBinauralBeats $GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
