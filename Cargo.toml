[package]
name = "open-binaural-beats"
version = "0.1.0"
edition = "2024"
description = "Lightweight native binaural beats player"
license = "MIT"
repository = "https://github.com/anoopengineer/OpenBinauralBeats"
homepage = "https://openbinauralbeats.com"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11", "accesskit"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "open-binaural-beats"
maintainer = "Anoop Kunjuraman <anoopengineer@gmail.com>"
copyright = "2026, Anoop Kunjuraman"
extended-description = "Free, open source binaural beats generator for focus, relaxation and sleep."
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/open-binaural-beats", "usr/bin/", "755"],
    ["packaging/linux/open-binaural-beats.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/open-binaural-beats.png", "644"],
    ["LICENSE", "usr/share/doc/open-binaural-beats/", "644"],
]
