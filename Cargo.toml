[package]
name = "binaural-beats"
version = "0.1.0"
edition = "2024"
description = "Lightweight native binaural beats player"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11", "accesskit"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
